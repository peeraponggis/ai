name: CORS Test

# ตอบคำถามเดียว: เบราว์เซอร์เรียก LLM ฟรีจากหน้าเว็บได้โดยตรงไหม
# สั่ง: git push origin HEAD:cors/now
on:
  push:
    branches: ['cors/*']

permissions:
  contents: write

jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 1) ดู CORS header ตรง ๆ ด้วย curl
        run: |
          set +e
          {
            echo "# ผลทดสอบ CORS — เรียก LLM ฟรีจากหน้าเว็บโดยตรง"
            echo
            echo "รันบน GitHub Actions (ubuntu-latest) เมื่อ $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "commit \`$GITHUB_SHA\`"
            echo
            echo "## ส่วนที่ 1 — HTTP header ดิบ (curl)"
            echo
            echo "ตัวชี้ขาดคือ header \`Access-Control-Allow-Origin\` ในคำตอบ"
            echo "ถ้าไม่มี = เบราว์เซอร์จะบล็อกทุกกรณี"
            echo
          } > /tmp/cors.md

          probe () {  # $1=ชื่อ $2=url $3=method
            echo "### $1" >> /tmp/cors.md
            echo >> /tmp/cors.md
            echo '```' >> /tmp/cors.md
            echo "\$ preflight OPTIONS $2  (Origin: https://example.com)" >> /tmp/cors.md
            curl -s -i -X OPTIONS "$2" \
              -H 'Origin: https://example.com' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization' \
              --max-time 25 2>&1 | head -c 1200 >> /tmp/cors.md
            echo >> /tmp/cors.md
            echo '```' >> /tmp/cors.md
            echo >> /tmp/cors.md
            sleep 2
          }

          probe "LLM7 — /v1/chat/completions" "https://api.llm7.io/v1/chat/completions"
          probe "LLM7 — /v1/models" "https://api.llm7.io/v1/models"
          probe "Pollinations — /openai" "https://text.pollinations.ai/openai"

          echo "### คำขอจริง (POST) พร้อม Origin" >> /tmp/cors.md
          echo >> /tmp/cors.md
          echo '```' >> /tmp/cors.md
          curl -s -i -X POST 'https://api.llm7.io/v1/chat/completions' \
            -H 'Origin: https://example.com' \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer unused' \
            -d '{"model":"codestral-latest","max_tokens":30,"temperature":0,"messages":[{"role":"user","content":"100000 หาร 5 เท่ากับเท่าไร ตอบสั้นที่สุด"}]}' \
            --max-time 40 2>&1 | head -c 1500 >> /tmp/cors.md
          echo >> /tmp/cors.md
          echo '```' >> /tmp/cors.md
          echo >> /tmp/cors.md
          exit 0

      - name: 2) รันหน้าเทสต์จริงในเบราว์เซอร์ Chromium
        run: |
          set +e
          npm i -D playwright@1.47.2 2>&1 | tail -3
          npx playwright install --with-deps chromium 2>&1 | tail -3
          python3 -m http.server 8080 --directory mockup >/tmp/serve.log 2>&1 &
          sleep 2
          cat > run.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            const errs = [];
            p.on('console', m => { if (m.type()==='error') errs.push(m.text()); });
            await p.goto('http://localhost:8080/cors-test.html');
            await p.click('#go');
            await p.waitForFunction(() => !document.getElementById('go').disabled, null, {timeout: 120000}).catch(()=>{});
            const rows = await p.$$eval('#tbl tbody tr', rs => rs.map(r =>
              [...r.querySelectorAll('td')].map(c => c.innerText.replace(/\s+/g,' ').trim()).join(' | ')));
            const verdict = await p.$eval('#verdict', e => e.innerText.trim()).catch(()=> '(ไม่มี)');
            const origin = await p.$eval('#origin', e => e.innerText.trim());
            console.log('ORIGIN:: ' + origin);
            rows.forEach(r => console.log('ROW:: ' + r));
            console.log('VERDICT:: ' + verdict);
            errs.forEach(e => console.log('CONSOLE_ERR:: ' + e.replace(/\s+/g,' ')));
            await b.close();
          })().catch(e => { console.log('FATAL:: ' + e.message); process.exit(0); });
          JS
          node run.js > /tmp/browser.txt 2>&1
          rm -f run.js
          {
            echo "## ส่วนที่ 2 — หน้าเทสต์จริงในเบราว์เซอร์ (Chromium, origin \`http://localhost:8080\`)"
            echo
            echo "โหลดหน้าผ่าน http จริง ไม่ใช่ \`file://\` — Origin จึงไม่ใช่ null เหมือนกรณีโฮสต์จริง"
            echo
            echo '```'
            cat /tmp/browser.txt
            echo '```'
            echo
          } >> /tmp/cors.md
          exit 0

      - name: 3) บันทึกผลลง repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/02-providers
          cp /tmp/cors.md research/02-providers/02-cors-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/02-providers/02-cors-result.md
          git commit -m "ผลทดสอบ CORS: เรียก LLM ฟรีจากเบราว์เซอร์ได้หรือไม่" || exit 0
          git push origin HEAD:claude/list-github-files-25syp1

      - name: สรุปขึ้นหน้า summary
        if: always()
        run: cat /tmp/cors.md >> $GITHUB_STEP_SUMMARY || true

      - name: ลบ branch ที่ใช้สั่งงาน
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true
