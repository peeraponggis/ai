name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SolarAI/tools/css/package-lock.json

      # สร้าง shared-assets/vendor/tailwind.css ใหม่จาก index.html ของทุกโมดูล
      # เพื่อให้ class ที่เพิ่งเพิ่มเข้าไปมีผลใน APK เสมอ
      - name: Rebuild Tailwind CSS
        working-directory: SolarAI/tools/css
        run: |
          npm ci
          npm run build
          cd ../..
          git diff --quiet shared-assets/vendor/tailwind.css \
            || echo "::notice::shared-assets/vendor/tailwind.css ในรีโปไม่ตรงกับ index.html — รัน 'npm run build' ใน tools/css แล้ว commit ด้วย"

      - name: Unit tests
        working-directory: SolarAI
        run: ./gradlew :voicetranslate:testDebugUnitTest --stacktrace

      # assembleDebug ที่ root สร้าง APK ให้ทุกโมดูล (:app และ :voicetranslate)
      - name: Build debug APKs
        working-directory: SolarAI
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Solar AI APK
        uses: actions/upload-artifact@v4
        with:
          name: solar-ai-debug-apk
          path: SolarAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Voice Translate APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-translate-debug-apk
          path: SolarAI/voicetranslate/build/outputs/apk/debug/voicetranslate-debug.apk
          if-no-files-found: error
