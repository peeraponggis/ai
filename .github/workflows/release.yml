name: Release APK

# build APK แล้วสร้าง GitHub Release พร้อมแนบไฟล์ .apk
# ให้ดาวน์โหลดตรงจาก tablet ได้เลย ไม่ต้อง login
#
# สั่งปล่อยเวอร์ชันใหม่ได้ 2 วิธี:
#   1. push tag:    git tag v1.0.1 && git push origin v1.0.1
#   2. push branch: git push origin HEAD:release/v1.0.1
#      (สำหรับ environment ที่ push tag ไม่ได้ — CI จะสร้าง tag ให้เอง
#       แล้วลบ branch ทิ้งหลัง release เสร็จ)
on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SolarAI/tools/css/package-lock.json

      - name: Rebuild Tailwind CSS
        working-directory: SolarAI/tools/css
        run: |
          npm ci
          npm run build

      # tag → ใช้ชื่อ tag ตรง ๆ / branch release/vX → ตัด 'release/' ออก
      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # มี secret KEYSTORE_BASE64 → build release ที่เซ็นด้วย key ถาวร (อัปเดตทับได้)
      # ไม่มี → ถอยไป debug build เพื่อไม่ให้การปล่อย release พังตอนยังไม่ได้ตั้ง secret
      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ยังไม่ได้ตั้ง secret KEYSTORE_BASE64 — ปล่อยเป็น debug build (ติดตั้งทับของเดิมไม่ได้)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # เช็ค secret ที่ขาดตั้งแต่ตอนนี้ ไม่ต้องรอ Gradle ฟ้องเป็น NullPointerException
          MISSING=
          [ -n "$KEYSTORE_PASSWORD" ] || MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || MISSING="$MISSING KEY_ALIAS"
          if [ -n "$MISSING" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret เหล่านี้:$MISSING (ตั้งที่ Settings → Secrets and variables → Actions)"
            exit 1
          fi

          KS="$RUNNER_TEMP/release.keystore"
          if ! echo "$KEYSTORE_BASE64" | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 ไม่ใช่ base64 ที่ถูกต้อง — ก๊อปไฟล์ keystore.base64 มาไม่ครบหรือมีอักขระแปลกปน"
            exit 1
          fi

          # พิมพ์ลายนิ้วมือของไฟล์ (ไม่ใช่ความลับ) เพื่อดูว่า base64 ที่วางไว้ครบถ้วนไหม
          echo "keystore ที่ถอดออกมาได้: $(stat -c%s "$KS") bytes"
          echo "sha256: $(sha256sum "$KS" | cut -d' ' -f1)"
          echo "ค่าที่ควรจะเป็น:          4300 bytes"
          echo "sha256: 435bafac2b97c10b8c3eef3ed332583664e3518cd824e055308c79d0805631bf"

          # แยกให้ชัดว่าปัญหาอยู่ที่รหัสผ่าน หรือที่ alias
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::เปิด keystore ไม่ได้ด้วย KEYSTORE_PASSWORD ที่ตั้งไว้ — ถ้า sha256 ด้านบนตรง แปลว่ารหัสผ่านผิด (ระวังช่องว่าง/บรรทัดใหม่ตอนก๊อป) ถ้า sha256 ไม่ตรง แปลว่า KEYSTORE_BASE64 ไม่ครบ"
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::รหัสผ่านถูกต้อง แต่ไม่พบ alias ที่ตั้งใน KEY_ALIAS — alias ที่มีอยู่จริงใน keystore แสดงด้านล่าง"
            keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" | grep -i "alias name" || true
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: SolarAI
        env:
          VERSION_NAME: ${{ steps.ver.outputs.number }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = true ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Rename APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = true ]; then
            SRC=SolarAI/app/build/outputs/apk/release/app-release.apk
          else
            SRC=SolarAI/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "solar-ai-${VERSION}.apk"
          ls -la solar-ai-*.apk

      # ยืนยันว่า APK เซ็นด้วย key จริงก่อนปล่อยออกไป
      - name: Verify signature
        if: steps.keystore.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "solar-ai-${VERSION}.apk"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          ## ติดตั้งบน tablet / มือถือ Android

          1. กดดาวน์โหลดไฟล์ `.apk` ด้านล่างจากเครื่องที่จะติดตั้งได้เลย
          2. เปิดไฟล์ที่ดาวน์โหลด → เครื่องจะถามสิทธิ์ **"ติดตั้งแอปที่ไม่รู้จัก"** → อนุญาต
          3. กดติดตั้ง → เปิดแอป → **กรอกค่าไฟ/เดือน แล้วกดเริ่มวิเคราะห์ได้เลย**

          ## ใช้ฟรี ไม่ต้องมี API Key

          ช่อง API Key **เว้นว่างไว้** — แอปคำนวณให้ในเครื่องทั้งหมด
          ไม่มีค่าใช้จ่าย ไม่ต้องสมัครอะไร ไม่ต้องต่ออินเทอร์เน็ต

          ได้รายงานครบ 6 ส่วน: ขนาดระบบ · การเงิน (payback / IRR / NPV / ROI) ·
          ความเสี่ยง · 4 ทางเลือก · ข้อเสนอขาย · บทสรุป

          *(ตัวเลือกเสริม: ถ้าใส่ Anthropic API Key จะให้ Claude เขียนวิเคราะห์เชิงลึกแทน
          ซึ่งมีค่าใช้จ่ายตามการใช้งาน — ไม่ใส่ก็ใช้ได้ครบทุกฟังก์ชัน)*

          ต้องใช้ Android 7.0 (API 24) ขึ้นไป

          ### หมายเหตุ

          BUILD_NOTE
          - ทั้ง CSS ฟอนต์ และเครื่องคำนวณอยู่ในไฟล์ APK ใช้งานออฟไลน์ได้เต็มรูปแบบ
          - ถ้าใส่ API Key คีย์จะเก็บอยู่ในเครื่องคุณเท่านั้น ไม่ได้ฝังมากับไฟล์ APK
          NOTES

          # เติมหมายเหตุเรื่องการเซ็นตามชนิด build ที่ปล่อยจริง
          if [ "${{ steps.keystore.outputs.signed }}" = true ]; then
            NOTE="- เซ็นด้วย release key ถาวร — ติดตั้งทับเวอร์ชันเดิมได้เลย ไม่ต้องถอนก่อน"
          else
            NOTE="- เป็น **debug build** เซ็นด้วย key ที่ CI สร้างใหม่ทุกครั้ง ถ้าติดตั้งทับของเดิมไม่ได้ ให้**ถอนการติดตั้งเดิมก่อน**"
          fi
          sed -i "s|BUILD_NOTE|${NOTE}|" notes.md

          # ถ้า trigger ด้วย branch, gh จะสร้าง tag ให้ที่ commit นี้
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Solar AI $VERSION" \
            --notes-file notes.md \
            "solar-ai-${VERSION}.apk"

      # branch release/* มีไว้ trigger อย่างเดียว ไม่ต้องเก็บไว้
      - name: Clean up trigger branch
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
