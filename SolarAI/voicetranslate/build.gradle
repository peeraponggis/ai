plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solarai.voicetranslate'
    compileSdk 34

    defaultConfig {
        applicationId "com.solarai.voicetranslate"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // vendor/ (Tailwind, Font Awesome, ฟอนต์) ใช้ร่วมกับโมดูล :app
    // path ใน HTML ยังเป็น vendor/... เหมือนกันทั้งสองแอป
    sourceSets {
        main {
            assets.srcDirs += ['../shared-assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'

    // ตัวแปลในเครื่อง (ค่าเริ่มต้น) — ฟรี ไม่ต้องมี API key ทำงาน offline หลังโหลดโมเดล
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'

    testImplementation 'junit:junit:4.13.2'
}
